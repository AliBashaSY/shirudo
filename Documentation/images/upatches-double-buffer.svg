<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">A double-buffered arena table: kernel hooks write into the active buffer; an export swaps the buffers, a serializer renders the drained buffer page by page into the shirudo_ser output map that shirudo upatch map reads, and the drained buffer is cleared after the last page</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g fill="#8a93a0" fill-opacity="0.06" stroke="#8a93a0" stroke-width="1.5">
    <rect x="20" y="40" width="130" height="50" rx="4"/>
    <rect x="200" y="40" width="160" height="50" rx="4"/>
    <rect x="200" y="160" width="160" height="50" rx="4"/>
    <rect x="410" y="160" width="130" height="50" rx="4"/>
    <rect x="590" y="160" width="150" height="50" rx="4"/>
  </g>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="185" y="20" width="190" height="210" rx="6"/>
  </g>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5" marker-end="url(#a)">
    <line x1="150" y1="65" x2="196" y2="65"/>
    <line x1="360" y1="185" x2="406" y2="185"/>
    <line x1="540" y1="185" x2="586" y2="185"/>
    <path d="M330,94 C350,120 350,130 330,156"/>
    <path d="M230,156 C210,130 210,120 230,94"/>
  </g>
  <g fill="#5d6675" font-size="13" text-anchor="middle">
    <text x="85" y="62">kernel hooks</text>
    <text x="85" y="78">append records</text>
    <text x="280" y="62">active buffer</text>
    <text x="280" y="78">this interval</text>
    <text x="280" y="182">drain buffer</text>
    <text x="280" y="198">previous interval</text>
    <text x="475" y="182">serializer</text>
    <text x="475" y="198">one page per run</text>
    <text x="665" y="182">shirudo_ser chunks</text>
    <text x="665" y="198">read by upatch map</text>
    <text x="388" y="130" text-anchor="start">swap at the start</text>
    <text x="388" y="146" text-anchor="start">of an export</text>
    <text x="280" y="246">one BPF arena</text>
  </g>
</svg>
