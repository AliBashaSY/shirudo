<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 76" width="720" height="76" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Runtime image of the default 15 MiB</title>
  <desc id="d">Of 15 MiB, the stripped target binary takes 12.7 MiB, file system structures, certificates and settings 1.0 MiB, and 1.3 MiB stay free.</desc>

  <style>
    .ink { fill: #171b22; }
    .muted { fill: #5d6675; }
    .grid { stroke: #e2e6eb; }
    .axis { stroke: #c3c9d1; }
    .s1 { fill: #2a78d6; }
    .s2 { fill: #eb6834; }
    .s3 { fill: #1baf7a; }
    .s4 { fill: #eda100; }
    .free { fill: #dde2e8; }
    .on-fill { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e4e8ee; }
      .muted { fill: #9ba5b3; }
      .grid { stroke: #262d37; }
      .axis { stroke: #39414c; }
      .s1 { fill: #3987e5; }
      .s2 { fill: #d95926; }
      .s3 { fill: #199e70; }
      .s4 { fill: #c98500; }
      .free { fill: #2f3640; }
    }
  </style>
  <rect class="s1" x="0.0" y="8.0" width="471.6" height="28.0" rx="4.0"/>
  <text class="on-fill" x="8.0" y="26.0" font-size="12" font-weight="600">12.7 MiB</text>
  <rect class="s2" x="473.6" y="8.0" width="37.8" height="28.0" rx="4.0"/>
  <rect class="free" x="513.4" y="8.0" width="46.6" height="28.0" rx="4.0"/>
  <text class="muted" x="570.0" y="26.0" font-size="12">1.3 MiB free</text>
  <rect class="s1" x="0.0" y="57.0" width="10.0" height="10.0" rx="2.0"/>
  <text class="muted" x="16.0" y="66.0" font-size="12">Target binary, stripped</text>
  <rect class="s2" x="191.8" y="57.0" width="10.0" height="10.0" rx="2.0"/>
  <text class="muted" x="207.8" y="66.0" font-size="12">File system structures, certificates, settings</text>
  <rect class="free" x="535.4" y="57.0" width="10.0" height="10.0" rx="2.0"/>
  <text class="muted" x="551.4" y="66.0" font-size="12">Free</text>
</svg>
