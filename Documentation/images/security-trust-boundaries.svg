<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" width="780" height="490" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">Trust boundaries of a shirudo deployment and the evidence boundary</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5">
    <rect x="10" y="40" width="200" height="120" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="10" y="340" width="200" height="100" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="230" y="10" width="170" height="290" rx="6" stroke-dasharray="6 4"/>
    <rect x="245" y="50" width="140" height="70" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="245" y="200" width="140" height="70" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="230" y="320" width="170" height="160" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <line x1="230" y1="392" x2="400" y2="392" stroke-dasharray="3 3"/>
    <rect x="420" y="10" width="350" height="470" rx="6" stroke-dasharray="6 4"/>
    <rect x="435" y="40" width="320" height="60" rx="4"/>
    <rect x="435" y="115" width="320" height="55" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="430" y="190" width="330" height="275" rx="6" stroke-dasharray="3 3" fill="#8a93a0" fill-opacity="0.05"/>
    <rect x="445" y="215" width="300" height="75" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="445" y="310" width="300" height="140" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <line x1="210" y1="85" x2="243" y2="85" marker-end="url(#arrow)"/>
    <line x1="385" y1="100" x2="443" y2="235" marker-end="url(#arrow)"/>
    <line x1="443" y1="270" x2="387" y2="245" marker-end="url(#arrow)"/>
    <line x1="445" y1="410" x2="402" y2="410" marker-end="url(#arrow)"/>
    <line x1="230" y1="410" x2="212" y2="410" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5d6675" font-size="13">
    <text x="20" y="32" font-weight="bold">Operator host</text>
    <text x="22" y="66">ML-DSA-87 signing key</text>
    <text x="22" y="88">shirudo-build, clang</text>
    <text x="22" y="110">signs upatches, indexes,</text>
    <text x="22" y="130">trees, configs, vouches</text>
    <text x="20" y="332" font-weight="bold">Verifier</text>
    <text x="22" y="366">attest verify, offline</text>
    <text x="22" y="388">pinned AK name</text>
    <text x="22" y="430">expected state, PCRs</text>
    <text x="240" y="32" font-weight="bold">Network, untrusted</text>
    <text x="255" y="74" font-weight="bold">OCI registry</text>
    <text x="255" y="94">packages, indexes,</text>
    <text x="255" y="112">tree publications</text>
    <text x="255" y="224" font-weight="bold">Collector</text>
    <text x="255" y="244">keepalives, map</text>
    <text x="255" y="262">snapshots</text>
    <text x="240" y="342" font-weight="bold">Evidence</text>
    <text x="430" y="32" font-weight="bold">Target</text>
    <text x="445" y="62" font-weight="bold">Root and other processes</text>
    <text x="445" y="84">constrained by the LSM, not trusted</text>
    <text x="445" y="137" font-weight="bold">Writable state</text>
    <text x="445" y="157">/var/lib/shirudo, sealed by label</text>
    <text x="455" y="237" font-weight="bold">Runtime tasks</text>
    <text x="455" y="257">exec from the dm-verity runtime</text>
    <text x="455" y="277">image grants the task mark</text>
    <text x="455" y="332" font-weight="bold">Kernel and TPM</text>
    <text x="455" y="354">BPF LSM: bpf2 and seal objects</text>
    <text x="455" y="374">.bpf and .dm-verity keyrings</text>
    <text x="455" y="394">private bpffs: pins and maps</text>
    <text x="455" y="430">TPM: register, AK, NV writer</text>
  </g>
  <g fill="#5d6675" font-size="11">
    <text x="440" y="207">target TCB</text>
    <text x="214" y="76">push</text>
    <text x="376" y="165">pull</text>
    <text x="392" y="282">export</text>
    <text x="240" y="362">TPM-signed:</text>
    <text x="240" y="379">quote, NV certification</text>
    <text x="240" y="412">target's own account:</text>
    <text x="240" y="429">eventlog, config history,</text>
    <text x="240" y="446">init record fields</text>
    <text x="240" y="463">(bound_in, ts, boot_id)</text>
  </g>
</svg>
