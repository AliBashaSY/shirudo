<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" role="img" aria-labelledby="t">
  <title id="t">A target with kernel release 7.4.0, architecture x86_64 and label env=prod goes through a tree publication in sequence order: it applies the operations whose selectors match, skips the others for good, and its cursor last_seq ends at the last operation</title>
  <style>@media (prefers-color-scheme: dark) { [fill="#5d6675"] { fill: #b4bcc7; } }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a93a0" stroke-width="1.5">
    <rect x="10" y="44" width="420" height="34" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="10" y="88" width="420" height="34" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="10" y="132" width="420" height="34" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="10" y="176" width="420" height="34" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="10" y="220" width="420" height="34" rx="4" fill="#8a93a0" fill-opacity="0.08"/>
    <rect x="470" y="44" width="280" height="34" rx="4"/>
    <rect x="470" y="88" width="280" height="34" rx="4"/>
    <rect x="470" y="132" width="280" height="34" rx="4" stroke-dasharray="4 3"/>
    <rect x="470" y="176" width="280" height="34" rx="4" stroke-dasharray="4 3"/>
    <rect x="470" y="220" width="280" height="34" rx="4"/>
    <line x1="430" y1="61" x2="468" y2="61" marker-end="url(#arrow)"/>
    <line x1="430" y1="105" x2="468" y2="105" marker-end="url(#arrow)"/>
    <line x1="430" y1="149" x2="468" y2="149" marker-end="url(#arrow)"/>
    <line x1="430" y1="193" x2="468" y2="193" marker-end="url(#arrow)"/>
    <line x1="430" y1="237" x2="468" y2="237" marker-end="url(#arrow)"/>
  </g>
  <g fill="#5d6675" font-size="11">
    <text x="10" y="28" font-size="13">Tree publication, in sequence order</text>
    <text x="470" y="20" font-size="13">Target</text>
    <text x="470" y="36">release 7.4.0, x86_64, label env=prod</text>
    <text x="22" y="65">1  add obs</text>
    <text x="160" y="65">no selector</text>
    <text x="22" y="109">2  add fix-a</text>
    <text x="160" y="109">kernel_release_prefix 7.4</text>
    <text x="22" y="153">3  add fix-b</text>
    <text x="160" y="153">architecture aarch64</text>
    <text x="22" y="197">4  add probe</text>
    <text x="160" y="197">labels env=canary</text>
    <text x="22" y="241">5  delete fix-a</text>
    <text x="160" y="241">kernel_release_prefix 7.4</text>
    <text x="482" y="65">applied: loaded and measured</text>
    <text x="482" y="109">applied: loaded and measured</text>
    <text x="482" y="153">skipped: architecture differs</text>
    <text x="482" y="197">skipped: label differs</text>
    <text x="482" y="241">applied: unloaded and measured</text>
    <text x="10" y="290">The cursor last_seq ends at 5. Operations 3 and 4 stay skipped, even if the target's labels or</text>
    <text x="10" y="308">kernel change later; a new operation with its own sequence number is the way to reach the target.</text>
  </g>
</svg>
