    .s2 { fill: #eb6834; }
    .s3 { fill: #1baf7a; }
    .s4 { fill: #eda100; }
    .free { fill: #dde2e8; }
    .on-fill { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e4e8ee; }
      .muted { fill: #9ba5b3; }
      .grid { stroke: #262d37; }
      .axis { stroke: #39414c; }
      .s1 { fill: #3987e5; }
      .s2 { fill: #d95926; }
      .s3 { fill: #199e70; }
      .s4 { fill: #c98500; }
      .free { fill: #2f3640; }
    }
  </style>
  <rect class="s1" x="0.0" y="8.0" width="59.8" height="28.0" rx="4.0"/>
  <text class="on-fill" x="8.0" y="26.0" font-size="12" font-weight="600">0.12 s</text>
  <rect class="s2" x="61.8" y="8.0" width="223.9" height="28.0" rx="4.0"/>
  <text class="on-fill" x="69.8" y="26.0" font-size="12" font-weight="600">0.46 s</text>
  <rect class="s3" x="287.8" y="8.0" width="272.2" height="28.0" rx="4.0"/>
  <text class="on-fill" x="295.8" y="26.0" font-size="12" font-weight="600">0.56 s</text>
  <rect class="s1" x="0.0" y="57.0" width="10.0" height="10.0" rx="2.0"/>
  <text class="muted" x="16.0" y="66.0" font-size="12">Images and keyrings</text>
  <rect class="s2" x="165.4" y="57.0" width="10.0" height="10.0" rx="2.0"/>
