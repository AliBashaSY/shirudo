<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 76" width="720" height="76" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Steps of init in the initrd</title>
  <desc id="d">Mapping, reading and verifying the images and sealing the keyrings take 0.12 s, loading and attaching the guards 0.46 s, and binding the measurement register 0.56 s.</desc>

  <style>
    .ink { fill: #171b22; }
